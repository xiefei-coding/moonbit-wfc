name: MoonBit quality checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install Pillow==12.3.0
      - run: npm ci --ignore-scripts
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon fmt && moon info && git diff --exit-code
      - run: moon check
      - run: moon test --target wasm-gc
      - run: moon test --target js
      - run: moon build --target js
      - name: Refresh actual browser engine
        run: |
          engine=$(find _build/js/debug/build/cmd/web -type f -name '*.js' | head -n 1)
          test -n "$engine"
          cp "$engine" web/engine.mjs
      - run: node tools/test-demo.mjs
      - run: node tools/test-cli.mjs
      - run: node tools/check-reference.mjs
      - run: node tools/test-generation.mjs
      - run: node tools/test-capacity.mjs
      - run: node tools/test-runtime.mjs
      - run: node tools/robustness.mjs
      - run: node tools/benchmark.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: evidence/
