<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WFC 图案工坊</title><style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#233c39;background:#f2f4ed;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{padding:26px 40px;border-bottom:1px solid #d4ddd0;display:flex;align-items:center;justify-content:space-between}h1{font-size:23px;letter-spacing:-.5px;margin:0}header p{margin:6px 0 0;font-size:13px;color:#62756a}.badge{font-size:12px;border:1px solid #bdcfc0;border-radius:30px;padding:7px 12px}.layout{max-width:1440px;margin:auto;padding:28px 40px;display:grid;grid-template-columns:310px minmax(0,1fr);gap:28px}.panel{min-width:0;background:#fffef8;border:1px solid #d8dfd1;border-radius:15px;padding:22px}h2{font-size:14px;margin:0 0 18px;font-weight:650}label{font-size:12px;color:#52675c;display:block;margin-bottom:7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}input[type=number],select{width:100%;font:inherit;font-size:14px;border:1px solid #c9d4c8;border-radius:7px;background:#fff;padding:9px;color:#233c39}button,.upload{border:1px solid #bfcdc1;background:#f6f8f0;border-radius:7px;color:#324b3c;padding:10px 12px;font:inherit;font-size:13px;cursor:pointer}button:hover,.upload:hover{background:#eaf1e4}button:disabled{opacity:.45;cursor:default}.examples{display:flex;gap:8px}.source{margin:20px 0;display:flex;align-items:center;gap:16px}.source canvas{width:112px;height:112px;border-radius:5px;border:1px solid #d5dfd0;image-rendering:pixelated;object-fit:contain;background:#e6eddf}.source span{font-size:12px;line-height:1.8;color:#637562}.upload{display:block;text-align:center}input[type=file]{width:100%;font-size:11px;margin-top:8px} .check{display:flex;gap:8px;align-items:center;margin:14px 0;font-size:12px}.check input{accent-color:#477453}.actions{display:grid;grid-template-columns:1fr 70px;gap:10px;margin-top:22px}#generate{background:#315f4c;color:#fff;border-color:#315f4c}#generate:hover{background:#254e3e}.result-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.result-head h2{margin:0}.canvas-wrap{min-height:480px;border:1px solid #d8dfd1;border-radius:11px;background:linear-gradient(45deg,#e4e8df 25%,transparent 25%),linear-gradient(-45deg,#e4e8df 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e4e8df 75%),linear-gradient(-45deg,transparent 75%,#e4e8df 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;display:grid;place-items:center;padding:28px;overflow:auto;position:relative}#result{width:min(100%,640px);height:auto;max-height:640px;object-fit:contain;image-rendering:pixelated;box-shadow:0 6px 25px #1c312b24}#status{font-size:13px;color:#526d5b;min-height:22px;margin:16px 0 0}#status.error{color:#a94031}.hint{color:#73826f;line-height:1.8;font-size:12px;margin-top:20px}.spinner{display:none;position:absolute;background:#fffef9ed;border-radius:10px;padding:20px 26px;box-shadow:0 4px 25px #11221122;font-size:14px}.busy .spinner{display:block}.advanced{max-width:1360px;margin:0 auto 30px;padding:0 40px;color:#61735f;font-size:12px}details{border-top:1px solid #ccd8c9;padding-top:15px}summary{cursor:pointer}textarea{width:100%;min-height:140px;resize:vertical;margin:14px 0;padding:12px;background:#fffef8;border:1px solid #ccd8c9;border-radius:8px;font:12px monospace}pre{white-space:pre-wrap;word-break:break-all;max-height:250px;overflow:auto;font-size:11px}footer{padding:12px 40px 25px;font-size:11px;color:#7d8b77}a{color:#426b52}@media(max-width:850px){header{padding:20px;gap:12px;flex-wrap:wrap}.layout{grid-template-columns:1fr;padding:20px}.canvas-wrap{min-height:280px}.advanced{padding:0 20px}}
</style></head><body><header><div><h1>WFC 图案工坊</h1><p>从一小块样本，生长出新的像素世界。</p></div><span class="badge">MoonBit · 0.4.0 · 本地生成</span></header>
<main class="layout"><section class="panel"><h2>01 / 选择样本</h2><div class="examples"><button id="island">群岛样本</button><button id="checker">棋盘样本</button></div><div class="source"><canvas id="sample" aria-label="输入样本"></canvas><span id="sample-name"></span></div><label for="upload" class="upload">导入 PNG 样本<input id="upload" type="file" accept="image/png"></label>
<div class="row"><div><label for="width">输出宽度</label><input id="width" type="number" min="1" max="256" value="64"></div><div><label for="height">输出高度</label><input id="height" type="number" min="1" max="256" value="64"></div></div>
<div class="row"><div><label for="size">图案尺寸</label><select id="size"><option value="1">1 × 1</option><option value="2">2 × 2</option><option value="3" selected>3 × 3</option><option value="4">4 × 4</option></select></div><div><label for="seed">随机种子</label><input id="seed" type="number" min="0" max="4294967295" value="17"></div></div>
<label class="check"><input id="symmetry" type="checkbox" checked>使用旋转与镜像</label><label class="check"><input id="periodic-input" type="checkbox" checked>样本边缘循环连接</label><label class="check"><input id="periodic" type="checkbox">输出边缘循环连接</label><div class="actions"><button id="generate">生成图案</button><button id="cancel" disabled>取消</button></div><p class="hint">同一配置和种子可复现。约束冲突时会显示无解；复杂样本可能需要减小输出尺寸。</p></section>
<section class="panel"><div class="result-head"><h2>02 / 生成结果</h2><button id="save" disabled>保存 PNG</button></div><div class="canvas-wrap" id="stage"><canvas id="result" aria-label="生成结果"></canvas><div class="spinner">正在求解，可随时取消…</div></div><p id="status" role="status" aria-live="polite">准备生成。</p></section></main>
<section class="advanced"><details><summary>高级 JSON 请求与结果</summary><textarea id="job" aria-label="JSON 请求"></textarea><button id="run-json">运行 JSON</button><pre id="json-result"></pre></details></section><footer>PNG 解码与生成均在本地。图案/瓦片模型、PNG/XML 文件入口和限制见 <a href="../README.md">项目说明</a>。尚未完成完整上游兼容和性能追平。</footer><script type="module" src="./app.mjs"></script></body></html>
